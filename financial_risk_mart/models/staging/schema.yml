version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_sk
        tests:
          - unique
          - not_null

  - name: stg_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: customer_sk
        tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_sk